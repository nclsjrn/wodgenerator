<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training</title>
<style>
  :root { --bg: #e9ecec; --surface: #f5f7f7; --ink: #14191c; --muted: #56626a; --rule: #c8d0d3; --accent: #4450b4; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #101315; --surface: #181d20; --ink: #e9eded; --muted: #96a2a7; --rule: #2a3236; --accent: #9aa8f2; --on-accent: #0b0e24; }
  }
  :root[data-theme="dark"] { --bg: #101315; --surface: #181d20; --ink: #e9eded; --muted: #96a2a7; --rule: #2a3236; --accent: #9aa8f2; --on-accent: #0b0e24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  nav { display: flex; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  nav button { flex: 1; min-height: 44px; border: 1px solid var(--rule); border-radius: 10px; background: transparent; color: var(--ink); font: 600 1rem system-ui, -apple-system, sans-serif; letter-spacing: 0.02em; }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  main { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  iframe[hidden] { display: none; }
  .note { position: absolute; inset: auto 16px 16px 16px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<nav role="tablist" aria-label="Apps">
  <button type="button" role="tab" id="tab-gen" aria-controls="frame-gen" aria-selected="true">Generator</button>
  <button type="button" role="tab" id="tab-log" aria-controls="frame-log" aria-selected="false">Training log</button>
</nav>
<main>
  <iframe id="frame-gen" title="Workout generator" src="https://nclsjrn.github.io/wodgenerator/" allow="clipboard-read; clipboard-write"></iframe>
  <iframe id="frame-log" title="Training log" src="https://nclsjrn-traininglog.netlify.app" hidden allow="clipboard-read; clipboard-write"></iframe>
</main>
<script>
  // Both apps stay loaded; switching only shows or hides them, so an unsaved workout is not reloaded away.
  (function () {
    var tabs = [document.getElementById('tab-gen'), document.getElementById('tab-log')];
    var frames = [document.getElementById('frame-gen'), document.getElementById('frame-log')];
    function show(i) {
      tabs.forEach(function (t, k) { t.setAttribute('aria-selected', String(k === i)); });
      frames.forEach(function (f, k) { f.hidden = k !== i; });
      try { localStorage.setItem('hub-tab', String(i)); } catch (e) {}
    }
    tabs.forEach(function (t, k) { t.addEventListener('click', function () { show(k); }); });
    var start = 0;
    try { start = Number(localStorage.getItem('hub-tab')) || 0; } catch (e) {}
    show(start === 1 ? 1 : 0);
  })();
</script>
</body>
</html>
